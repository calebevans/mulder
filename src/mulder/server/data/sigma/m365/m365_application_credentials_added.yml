title: Microsoft 365 Credentials Added To An Application Or Service Principal
id: 0450b666-a152-4aef-a11a-bde21544b796
status: experimental
description: Detects a password or certificate being added to an application registration or a service principal. Whoever holds it can sign in as the application, with its permissions.
references:
    - https://learn.microsoft.com/en-us/security/operations/incident-response-playbook-compromised-malicious-app
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: mulder
date: 2026-11-18
tags:
    - attack.persistence
    - attack.t1098.001
logsource:
    product: m365
    service: audit
detection:
    selection_principal:
        Operation|startswith: 'Add service principal credentials'
    selection_application:
        Operation|contains: 'Certificates and secrets management'
    condition: 1 of selection_*
falsepositives:
    - Administrators and deployment pipelines rotating application secrets
level: medium
