title: Microsoft 365 Transport Rule Created Or Changed
id: b2beed55-d7ff-4060-ae8d-99720c563c05
status: experimental
description: Detects a mail flow (transport) rule being created or changed. Such a rule acts on every message of the organisation, so one rule can copy, redirect or delete mail for all mailboxes.
references:
    - https://learn.microsoft.com/en-us/exchange/security-and-compliance/mail-flow-rules/mail-flow-rules
    - https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account
author: mulder
date: 2026-11-18
tags:
    - attack.collection
    - attack.t1114.003
    - attack.defense-evasion
    - attack.t1564.008
logsource:
    product: m365
    service: audit
detection:
    selection:
        Operation:
            - 'New-TransportRule'
            - 'Set-TransportRule'
    filter_system:
        UserId|startswith: 'NT AUTHORITY\SYSTEM'
    condition: selection and not filter_system
falsepositives:
    - Administrators maintaining mail flow rules, disclaimers and encryption policies
level: medium
