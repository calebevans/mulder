title: GCP Service Account Key Created
id: 5d6f1c1e-2a57-4b0a-9d5c-0f3f6f0a7c11
status: experimental
description: Detects creation of a user-managed service account key, a long-lived credential that keeps working after the account that created it is locked out.
references:
    - https://cloud.google.com/iam/docs/audit-logging/examples-service-accounts
author: mulder
date: 2026-11-17
tags:
    - attack.persistence
    - attack.t1098.001
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name|endswith: 'CreateServiceAccountKey'
    condition: selection
falsepositives:
    - Scheduled key rotation
level: medium
