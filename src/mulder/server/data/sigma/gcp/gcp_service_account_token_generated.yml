title: GCP Service Account Credential Generated
id: 2c7e9a40-1f3b-4d68-8e57-a1b6c3d9e033
status: experimental
description: Detects a principal generating short-lived credentials for a service account (impersonation). Logged only when Data Access audit logs are enabled for the IAM Service Account Credentials API.
references:
    - https://cloud.google.com/iam/docs/audit-logging/examples-service-accounts
author: mulder
date: 2026-11-17
tags:
    - attack.privilege-escalation
    - attack.t1548
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name|endswith:
            - 'GenerateAccessToken'
            - 'GenerateIdToken'
            - 'SignBlob'
            - 'SignJwt'
    condition: selection
falsepositives:
    - Workloads that impersonate a service account by design
level: low
