title: GCP Secret Manager Secret Accessed
id: 4e8b2f93-7c1d-4a35-9f60-b5d2a8c6e055
status: experimental
description: Detects the payload of a Secret Manager secret version being read. Logged only when Data Access audit logs are enabled for the Secret Manager API.
references:
    - https://cloud.google.com/secret-manager/docs/audit-logging
author: mulder
date: 2026-11-17
tags:
    - attack.credential-access
    - attack.t1555.006
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name|endswith: 'AccessSecretVersion'
    condition: selection
falsepositives:
    - Applications reading their own secrets at start-up
level: low
