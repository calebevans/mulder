repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-S, warning]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - mcp>=1.27,<2
          - httpx>=0.27
          - sqlalchemy[mypy]>=2.0
          - pydantic>=2.12
          - click>=8.3
          - jinja2>=3.1.6
          - types-Markdown
          - detect-secrets>=1.5
          - python-evtx>=0.8.1
          - pytest
