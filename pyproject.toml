[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mulder-dfir"
dynamic = ["version"]
description = "Autonomous digital-forensics investigation orchestrator and MCP server for the SANS SIFT Workstation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Caleb Evans" },
]
keywords = [
    "forensics",
    "dfir",
    "incident-response",
    "sift",
    "volatility",
    "mitre-attack",
    "security",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44.0",
    "mcp>=2.0",
    "sqlalchemy>=2.0",
    "volatility3>=2.0",
    "detect-secrets>=1.5",
    "pydantic>=2.12",
    "click>=8.3",
    "jinja2>=3.1.6",
    "markdown>=3.6",
    "python-evtx>=0.8.1",
    "claude-agent-sdk>=0.2",
    "rich>=15.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "oletools>=0.60",
    "python-registry>=1.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
stix = ["stix2>=3.0"]
web = [
    "starlette>=0.41",
    "uvicorn>=0.30",
]
# Zircolite's runtime dependencies. Verified against
# https://github.com/wagga40/Zircolite/blob/2.20.0/requirements.txt (the four
# required entries) plus `evtx`, which Zircolite imports optionally and which
# mulder needs for the "evtx" input format exposed in zircolite.py:_FORMAT_FLAGS.
# NOT included: aiohttp / urllib3 / requests / elasticsearch (remote forwarding),
# lxml (XML input), pysigma* (rule compilation) - mulder uses none of those paths.
# jinja2 and pyyaml, which Zircolite also imports optionally, are already
# mulder dependencies above.
# NOT covered by this extra: ALEAPP and iLEAPP. Their upstream requirements.txt
# files carry a git URL, local wheel paths and mutually conflicting pins, so they
# cannot be expressed as a PyPI extra; install them with
# `mulder setup --full --inject-deps`.
forensics = [
    "orjson>=3.9.15",
    "xxhash>=3.0",
    "colorama>=0.4.4",
    "tqdm>=4.58.0",
    "evtx>=0.6.2",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    # `make dist-check` / the release workflow validate the built metadata
    # before anything is uploaded.
    "twine",
]

[project.urls]
Homepage = "https://github.com/calebevans/mulder"
Source = "https://github.com/calebevans/mulder"
Documentation = "https://github.com/calebevans/mulder/blob/main/docs/usage-guide.md"
Issues = "https://github.com/calebevans/mulder/issues"
Changelog = "https://github.com/calebevans/mulder/releases"
"Example report" = "https://calebevans.github.io/mulder/examples/srl-2018/SRL-2018.report.html"

[project.scripts]
mulder = "mulder.cli:cli"
# `uvx <name>` runs the console script matching the *package* name, so the alias
# makes `uvx mulder-dfir serve` work without `--from`.
mulder-dfir = "mulder.cli:cli"

[tool.hatch.version]
path = "src/mulder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mulder"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
    "volatility3.*",
    "Evtx.*",
    "pysqlcipher3.*",
    "psutil",
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "rich",
    "rich.*",
    "markdown",
    "yaml",
    "oletools",
    "oletools.*",
    "Registry",
    "Registry.*",
    "stix2",
    "stix2.*",
    "weasyprint",
    "weasyprint.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
ignore_missing_imports = true

# Tests monkeypatch through the module under test --
# `monkeypatch.setattr(probes.shutil, "which", ...)` is the standard pytest
# idiom, and patching `install.ASSETS` is deliberately *not* the same as
# patching `manifest.ASSETS`. `no_implicit_reexport` (implied by --strict)
# rejects every such access, and the option is read from the module being
# imported *from*, so it has to be declared here rather than under `tests.*`.
# Scoped to the three modules the suite actually reaches into, so the rest of
# the package keeps the explicit-re-export guarantee.
[[tool.mypy.overrides]]
module = [
    "mulder.assets.install",
    "mulder.assets.paths",
    "mulder.doctor.probes",
]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
