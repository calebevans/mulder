[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mulder"
version = "0.1.0"
description = "Custom MCP server for SANS SIFT Workstation forensic investigations"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Caleb Evans" },
]
dependencies = [
    "mcp>=1.27",
    "cordon>=1.0.2",
    "sqlite-vec>=0.1.9",
    "litellm>=1.83",
    "detect-secrets>=1.5",
    "pydantic>=2.12",
    "click>=8.3",
    "jinja2>=3.1.6",
    "python-evtx>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pre-commit",
]

[project.scripts]
mulder = "mulder.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mulder"]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
