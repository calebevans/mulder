[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mulder-mcp"
version = "1.0.0"
description = "Custom MCP server for SANS SIFT Workstation forensic investigations"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Caleb Evans" },
]
dependencies = [
    "mcp>=1.27",
    "sqlalchemy>=2.0",
    "volatility3>=2.0",
    "detect-secrets>=1.5",
    "pydantic>=2.12",
    "click>=8.3",
    "jinja2>=3.1.6",
    "markdown>=3.6",
    "python-evtx>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
]

[project.scripts]
mulder = "mulder.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mulder"]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
    "volatility3.*",
    "Evtx.*",
    "pysqlcipher3.*",
    "psutil",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
