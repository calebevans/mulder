name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "Makefile"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "Makefile"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit
        run: uv run --locked --extra dev pre-commit run --all-files

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match the Programming Language :: Python :: 3.x classifiers and
        # requires-python in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --extra dev --python ${{ matrix.python-version }} pytest tests/ -v

      - name: Run deterministic benchmark subset
        run: >-
          uv run --locked --extra dev --python ${{ matrix.python-version }} mulder benchmark
          benchmarks/ci/manifest-v1.yaml benchmarks/ci/result-reference.json
          --output benchmark-ci-score.json

  dists:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Build distributions
        run: uv build

      - name: Verify package metadata
        run: uvx twine check --strict dist/*

      # The sdist `include` list in pyproject.toml is an allow-list, so package
      # data added outside /src silently vanishes. Extend this when more is added.
      - name: Verify package data is present
        run: |
          tar tzf dist/*.tar.gz | grep -q 'mulder/data/mcp.json'
          tar tzf dist/*.tar.gz | grep -q 'mulder/py.typed'
          tar tzf dist/*.tar.gz | grep -q 'mulder/assets/assets.lock'
          python3 -m zipfile -l dist/*.whl | grep -q 'mulder/data/mcp.json'
          python3 -m zipfile -l dist/*.whl | grep -q 'mulder/py.typed'
          # Without the lock, `mulder setup` refuses every digest-pinned asset.
          python3 -m zipfile -l dist/*.whl | grep -q 'mulder/assets/assets.lock'

  container:
    name: Container build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mulder:ci-smoke
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # The image ships every asset already provisioned under /opt, so
      # `setup --verify` must find all of them and exit 0. --user mulder,
      # because entrypoint.sh ends `exec gosu mulder "$@"`: as root this would
      # test a configuration no user ever gets.
      - name: Smoke-test 'mulder setup --verify' inside the image
        run: |
          set -euo pipefail
          docker run --rm --user mulder --entrypoint mulder mulder:ci-smoke \
            setup --verify --json > verify.json
          python3 - <<'PY'
          import json
          report = json.load(open("verify.json"))
          assert report["root"] == "/opt", report["root"]
          bad = [
              a for a in report["assets"]
              if a["selected"] and a["status"] not in ("up-to-date", "up-to-date (unmanaged)")
          ]
          assert not bad, bad
          shadowed = [a for a in report["assets"] if a["shadowed_by"]]
          assert not shadowed, shadowed
          assert report["exit"] == 0, report["exit"]
          PY
