name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "Makefile"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "Makefile"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit
        run: uv run --locked --extra dev pre-commit run --all-files

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match the Programming Language :: Python :: 3.x classifiers and
        # requires-python in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --extra dev --python ${{ matrix.python-version }} pytest tests/ -v

  dists:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Build distributions
        run: uv build

      - name: Verify package metadata
        run: uvx twine check --strict dist/*

      # The sdist `include` list in pyproject.toml is an allow-list, so package
      # data added outside /src silently vanishes. Extend this when more is added.
      - name: Verify package data is present
        run: |
          tar tzf dist/*.tar.gz | grep -q 'mulder/data/mcp.json'
          tar tzf dist/*.tar.gz | grep -q 'mulder/py.typed'
          tar tzf dist/*.tar.gz | grep -q 'mulder/assets/assets.lock'
          python3 -m zipfile -l dist/*.whl | grep -q 'mulder/data/mcp.json'
          python3 -m zipfile -l dist/*.whl | grep -q 'mulder/py.typed'
          # Without the lock, `mulder setup` refuses every digest-pinned asset.
          python3 -m zipfile -l dist/*.whl | grep -q 'mulder/assets/assets.lock'

  container:
    name: Build container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: mulder:ci-smoke
          cache-from: |
            type=gha,scope=container-${{ matrix.arch }}
            type=gha,scope=buildkit
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=container-{0}', matrix.arch) || '' }}

      - name: Report container size and layers
        run: |
          docker image inspect mulder:ci-smoke --format 'Image size (bytes): {{.Size}}'
          docker history mulder:ci-smoke

      # Use the normal entrypoint so checks run as the same non-root user as
      # investigations. Synthetic evidence keeps the tests offline and small.
      - name: Smoke-test container runtime
        run: |
          docker run --rm -i --pull=never --network none mulder:ci-smoke \
            python3 - < scripts/container-smoke.py

  container-check:
    # Preserve the existing required status check, covering both architectures.
    name: Container build
    needs: container
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platform builds and smoke tests
        env:
          RESULT: ${{ needs.container.result }}
        run: test "$RESULT" = success
