name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "Makefile"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "Makefile"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit
        run: uv run --locked --extra dev pre-commit run --all-files

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: shellcheck -S warning install.sh uninstall.sh scripts/entrypoint.sh

  installer-smoke:
    # A stock Ubuntu container has none of SIFT's tools, so this proves the
    # venv bootstrap, the wrapper, non-root usability, idempotence and the
    # uninstall path. It does NOT prove SIFT compatibility.
    name: Installer smoke (stock Ubuntu container, not SIFT)
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Install container prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          # python3 and python3-virtualenv mirror what a real SIFT box already
          # has; a minimised ubuntu:24.04 image ships neither.
          apt-get install -y -qq --no-install-recommends \
            sudo curl git ca-certificates python3 python3-virtualenv

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install (minimal tier)
        run: ./install.sh --minimal --yes

      - name: Assert the installed version matches pyproject.toml
        run: |
          expected="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          got="$(mulder --version)"
          echo "pyproject=$expected  mulder --version -> $got"
          case "$got" in
            *"$expected"*) echo "version matches" ;;
            *) echo "version mismatch"; exit 1 ;;
          esac

      - name: Assert the venv is usable by a non-root user
        # This is the check that catches a venv whose interpreter or prefix is
        # unreadable by the actual runtime user (sansforensics on SIFT).
        run: sudo -u nobody /opt/mulder/venv/bin/mulder --version

      - name: Verify (REQUIRED probes only; no --strict)
        run: ./install.sh --verify

      - name: Re-run must be idempotent
        run: ./install.sh --minimal --yes

      - name: Uninstall
        run: |
          ./uninstall.sh --yes
          test ! -d /opt/mulder
          test ! -e /usr/local/bin/mulder

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --locked --extra dev pytest tests/ -v

  container:
    name: Container build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min' || '' }}

      - name: Generate artifact attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
