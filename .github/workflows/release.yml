name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to rebuild (for example v1.5.9)
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Verify published tag and package version
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Expected a stable release tag such as v1.5.9")
          release = json.loads(subprocess.check_output([
              "gh", "release", "view", tag, "--repo", os.environ["GITHUB_REPOSITORY"],
              "--json", "isDraft,isPrerelease,tagName",
          ]))
          if release["isDraft"] or release["isPrerelease"] or release["tagName"] != tag:
              raise SystemExit("The tag must have a published stable GitHub release")
          latest = subprocess.check_output([
              "gh", "release", "view", "--repo", os.environ["GITHUB_REPOSITORY"],
              "--json", "tagName", "--jq", ".tagName",
          ], text=True).strip()
          if latest != tag:
              raise SystemExit("Only the latest release may update the shared image tags")
          tree = ast.parse(Path("src/mulder/__init__.py").read_text())
          version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nsha={sha}\n")
          PY

  build:
    name: Build release image (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native runners avoid the QEMU/libc-bin crash seen in the v1.5.3 build.
      # Publish by digest first; release tags move only after both builds succeed.
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.source.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          cache-from: |
            type=gha,scope=container-${{ matrix.arch }}
            type=gha,scope=buildkit
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish multi-platform image
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.source.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.source.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.source.outputs.tag }}
            type=raw,value=latest

      - name: Publish manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$TAGS"
          digests=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            digests+=("$IMAGE@sha256:$digest")
          done
          test "${#digests[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${digests[@]}" \
            --metadata-file "$RUNNER_TEMP/manifest.json"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
