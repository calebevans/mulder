name: Publish to PyPI

# Tag-triggered only. A `push` trigger carrying a `tags` filter and no `branches`
# filter cannot match a branch push, so an ordinary commit to main can never
# publish. `workflow_dispatch` exists so a failed upload can be re-run without
# inventing a new tag; the tag-ref guard below keeps it honest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build-dists:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Verify this is a tag ref
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "::error::publish.yml must run against a tag ref, got $GITHUB_REF"; exit 1 ;;
          esac

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -oP '(?<=__version__ = ")[^"]+' src/mulder/__init__.py)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $pkg"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Generate and verify release supply-chain metadata
        run: |
          epoch="$(git log -1 --format=%ct)"
          uv run --frozen mulder release-metadata generate \
            --project-root . \
            --artifact-dir dist \
            --output release-supply-chain.json \
            --source-revision "$GITHUB_SHA" \
            --source-date-epoch "$epoch" \
            --builder-id "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          uv run --frozen mulder release-metadata verify \
            release-supply-chain.json --release-root .

      - name: Verify package metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Upload release supply-chain metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-supply-chain-metadata
          path: release-supply-chain.json

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: [build-dists]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mulder-dfir
    # Trusted Publishing (OIDC): no API token anywhere. `id-token: write` is
    # scoped to this job alone, which runs nothing from the repo - it only
    # downloads the artifact built by the unprivileged job above.
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
